<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Premium PlayerCard Preview</title>
    <link rel="stylesheet" href="./premium-playercard-preview.css">
  </head>
  <body>
    <main class="preview-shell" aria-label="Premium PlayerCard Dev Preview">
      <section class="premium-playercard" aria-label="PlayerCard Preview">
        <div class="premium-playercard__inner">
          <div class="premium-playercard__top">
            <div class="premium-playercard__avatar-cluster" aria-label="Profil Level 1">
              <div class="premium-playercard__avatar">
                <img class="premium-playercard__avatar-ring" src="../assets/ui/playercard-premium/playercard_avatar_ring.svg" alt="" aria-hidden="true">
                <img class="premium-playercard__avatar-art" src="../assets/ui/playercard-premium/playercard_avatar_placeholder.png" alt="" aria-hidden="true">
              </div>
              <div class="premium-playercard__level">
                <img src="../assets/ui/playercard-premium/playercard_level_badge_frame.svg" alt="" aria-hidden="true">
                <span>LVL</span>
                <strong>1</strong>
              </div>
            </div>

            <div class="premium-playercard__identity">
              <div class="premium-playercard__name-row">
                <strong class="premium-playercard__name">Local Dev</strong>
                <span class="premium-playercard__rank">
                  <img src="../assets/ui/playercard-premium/playercard_rank_plate.svg" alt="" aria-hidden="true">
                  <span>STARTER</span>
                </span>
              </div>
              <span class="premium-playercard__xp-text">XP: 4 / 150</span>
              <div class="premium-playercard__xp-track" aria-label="XP Fortschritt">
                <span class="premium-playercard__xp-fill" style="width: 2.7%"></span>
                <img src="../assets/ui/playercard-premium/playercard_xp_glow_cap.svg" alt="" aria-hidden="true">
              </div>
            </div>

            <div class="premium-playercard__tools">
              <div class="premium-playercard__coins" aria-label="Coins 1.000">
                <img class="premium-playercard__coin-frame" src="../assets/ui/playercard-premium/playercard_coin_capsule_frame.svg" alt="" aria-hidden="true">
                <img class="premium-playercard__coin-icon" src="../assets/ui/playercard-premium/playercard_coin_premium.png" alt="" aria-hidden="true">
                <strong>1.000</strong>
              </div>
              <button class="premium-playercard__menu" type="button" aria-label="Menue oeffnen">
                <img src="../assets/ui/playercard-premium/playercard_menu_button.svg" alt="" aria-hidden="true">
              </button>
            </div>
          </div>

          <div class="premium-playercard__bottom">
            <div class="premium-playercard__run">
              <img src="../assets/ui/playercard-premium/playercard_run_icon.svg" alt="" aria-hidden="true">
              <div class="premium-playercard__run-copy">
                <p><span>RUN-ZIEL:</span> Stabil halten</p>
                <p><span>FORTSCHRITT:</span> Tag 0/30 &middot; 0 Stress 0.2</p>
              </div>
            </div>
            <div class="premium-playercard__daily">
              <img src="../assets/ui/playercard-premium/playercard_daily_icon.svg" alt="" aria-hidden="true">
              <div>
                <strong>Daily Achievements</strong>
                <span>2 von 3 Aufgaben bereit</span>
              </div>
              <span class="premium-playercard__daily-dots" aria-hidden="true">
                <i></i>
                <i></i>
                <i></i>
              </span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
